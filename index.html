<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    .meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحانات المدخل للعلوم القانونية - المغرب</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <header class="border-b pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-blue-900">امتحان مادة المدخل لدراسة العلوم القانونية</h1>
            <p class="text-sm text-slate-500 mt-1">جامعة محمد الخامس - كلية العلوم القانونية والاقتصادية والاجتماعية أكدال</p>
        </header>

        <div id="quiz-container">
            <div id="question-box" class="mb-6">
                <span id="q-number" class="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">السؤال 1 من 3</span>
                <h2 id="q-text" class="text-lg font-medium mt-3 text-slate-900"></h2>
            </div>

            <div id="options-box" class="space-y-3 mb-6">
                <!-- خيارات الإجابة -->
            </div>

            <div class="flex justify-between items-center border-t pt-4">
                <span id="score-display" class="font-semibold text-slate-600">النتيجة: 0</span>
                <button id="next-btn" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-xl transition hidden">السؤال الموالي</button>
            </div>
        </div>

        <div id="result-box" class="hidden text-center py-8">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">انتهى الاختبار!</h2>
            <p id="final-score" class="text-lg text-slate-600 mb-6"></p>
            <button onclick="restartQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-xl">إعادة الاختبار</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "ما هو المعيار الأساسي للتمييز بين القواعد الآمرة والقواعد المكملة؟",
                options: [
                    "مصدر القاعدة القانونية (تشريع أو عرف)",
                    "مدى جواز الاتفاق على مخالفة القاعدة من عدمه",
                    "مدى تعلق القاعدة بالسلطة القضائية",
                    "الجزاء المترتب على المخالفة جنائياً"
                ],
                correct: 1
            },
            {
                question: "تتميز القاعدة القانونية في المجتمع بكونها:",
                options: [
                    "قاعدة إرادية اختيارية تخص الأفراد وحدهم",
                    "قاعدة عامة ومجردة وملزمة تفرضها السلطة العامة",
                    "قاعدة موجهة للمجتمعات البدائية فقط",
                    "قاعدة غير ملزمة إلا برضى الطرفين"
                ],
                correct: 1
            },
            {
                question: "إلى كم قسم رئيسي يُقسم الفقه القانوني فروع القانون عموماً؟",
                options: [
                    "قانون مدني وقانون تجاري",
                    "قانون مكتوب وقانون غير مكتوب",
                    "قانون عام وقانون خاص",
                    "تشريع أساسي وتشكيل فرعي"
                ],
                correct: 2
            },
            {
                question: "يُقصد بالقواعد الآمرة في القانون:",
                options: [
                    "القواعد التي يجوز للأفراد الاتفاق على استبعادها",
                    "القواعد التي لا يمكن الاتفاق على مخالفتها لأنها تتعلق بالنظام العام",
                    "القواعد التي تترك لإرادة المتعاقدين كامل الحرية",
                    "القواعد المكملة لإرادة الأطراف"
                ],
                correct: 1
            },
            {
                question: "يعتبر التشريع الأساسي (الدستور) في المملكة المغربية بمثابة:",
                options: [
                    "قانون عادي يصدر عن رئيس الحكومة",
                    "مجموعة قواعد تنظيمية فرعية",
                    "أسمى قانون في الدولة والذي تقوم على أساسه كل التنظيمات والسلطات",
                    "قواعد عرفية غير مكتوبة"
                ],
                correct: 2
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = questions[currentIdx];
            document.getElementById('q-number').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            document.getElementById('q-text').innerText = q.question;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right p-4 rounded-xl border border-slate-200 hover:bg-slate-100 transition font-medium text-slate-700';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsBox.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIdx, btnElement) {
            if (answered) return;
            answered = true;

            const q = questions[currentIdx];
            const buttons = document.getElementById('options-box').children;

            if (selectedIdx === q.correct) {
                btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                score++;
                document.getElementById('score-display').innerText = `النتيجة: ${score}`;
            } else {
                btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                buttons[q.correct].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('result-box').classList.remove('hidden');
                document.getElementById('final-score').innerText = `لقد اجبت بنجاح على ${score} من أصل ${questions.length} أسئلة.`;
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('score-display').innerText = `النتيجة: 0`;
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
